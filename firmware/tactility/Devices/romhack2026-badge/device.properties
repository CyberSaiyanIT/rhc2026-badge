general.vendor=Romhack
general.name=Romhack Camp Badge 2026
general.incubating=true

apps.launcherAppId=tactility.launcher

apps.retroGo=true

hardware.target=ESP32S3
hardware.flashSize=16MB
hardware.spiRam=true
hardware.spiRamMode=OCT
hardware.spiRamSpeed=80M
# Internal RAM is the scarce resource, not SPIRAM. IDF's 16384 default keeps most allocations
# internal; 4096 pushes more of them out to SPIRAM.
hardware.spiRamMallocAlwaysInternal=4096
hardware.esptoolFlashFreq=80M

display.size=2.4"
display.shape=rectangle
display.dpi=166

lvgl.colorDepth=16

# Matching the FAT sector to the 4096-byte flash block removes the wear-levelling layer's
# read-erase-rewrite emulation, which held /data writes to ~5 KB/s. Needs a 256k system
# partition and reformats /data, so an existing badge needs a full flash.
hardware.fatSectorSize=4096
storage.userDataLocation=Internal

sdkconfig.CONFIG_TT_EARLY_SPLASH=y
# the early splash is already up
sdkconfig.CONFIG_TT_SPLASH_DURATION=0
sdkconfig.CONFIG_LV_DEF_REFR_PERIOD=10
sdkconfig.CONFIG_TT_LVGL_DRAW_BUFFER_DIVISOR=10

#debug
sdkconfig.CONFIG_HEAP_POISONING_COMPREHENSIVE=y
sdkconfig.CONFIG_FREERTOS_CHECK_STACKOVERFLOW_PTRVAL=y
sdkconfig.CONFIG_FREERTOS_WATCHPOINT_END_OF_STACK=y
